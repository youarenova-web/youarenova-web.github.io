<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nova | A cinematic story about mindset, identity and self-discovery</title>

  <meta name="description" content="Nova is a cinematic Instagram story about mindset, identity, inner strength and self-discovery. Enter the world of Nova." />
  <meta name="keywords" content="Nova, You Are Nova, mindset, self-discovery, identity, inner strength, cinematic story, Instagram story, psychological storytelling" />
  <meta name="author" content="Nova" />
  <meta name="robots" content="index, follow" />

  <link rel="canonical" href="https://youarenova.ai/" />

  <meta property="og:title" content="Nova | You were meant to find this." />
  <meta property="og:description" content="A cinematic story about mindset, identity and self-discovery." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://youarenova.ai/" />
  <meta property="og:image" content="https://youarenova.ai/Nova-final-01.jpg" />

  <meta name="twitter:card" content="summary_large_image" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Nova",
    "url": "https://youarenova.ai/",
    "sameAs": [
      "https://www.instagram.com/you.are.nova/"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #05020a;
      --text: #ffffff;
      --line: rgba(255,255,255,0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05020a;
      font-family: "Montserrat Alternates", sans-serif;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      transform: scale(1.05);

      filter:
        brightness(0.48)
        contrast(1.12)
        saturate(1.08);

      animation: videoMove 16s ease-in-out infinite alternate;
    }

    .overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.30),
          rgba(0,0,0,0.60)
        ),

        radial-gradient(
          circle at center,
          rgba(255, 60, 170, 0.12),
          transparent 30%
        ),

        radial-gradient(
          circle at center,
          rgba(155, 92, 255, 0.10),
          transparent 42%
        ),

        radial-gradient(
          circle at center,
          transparent 30%,
          rgba(0,0,0,0.58) 100%
        );

      z-index: 2;
    }

    .particles,
    .particles::before,
    .particles::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      z-index: 3;
    }

    .particles {
      background:
        radial-gradient(circle, rgba(255,255,255,0.10) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,100,220,0.14) 0 1.2px, transparent 1.8px),
        radial-gradient(circle, rgba(180,110,255,0.14) 0 1.2px, transparent 1.8px);

      background-size:
        180px 180px,
        240px 240px,
        320px 320px;

      animation: particlesMove 18s linear infinite;

      opacity: 0.55;
    }

    .particles::before {
      background:
        radial-gradient(circle, rgba(255,255,255,0.08) 0 1px, transparent 1.4px);

      background-size: 260px 260px;

      animation: particlesMoveReverse 24s linear infinite;

      opacity: 0.4;
    }

    .content {
      position: relative;
      z-index: 10;

      width: min(92vw, 900px);

      text-align: center;

      animation: fadeIn 1.4s ease;
    }

    .eyebrow {
      margin-bottom: 18px;

      font-size: 12px;
      font-weight: 500;

      letter-spacing: 0.42em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.82);
    }

    h1 {
      font-size: clamp(68px, 14vw, 168px);

      line-height: 0.84;

      font-weight: 800;

      letter-spacing: -0.07em;

      text-transform: lowercase;

      color: white;

      text-shadow:
        0 0 18px rgba(255,255,255,0.04),
        0 0 40px rgba(214, 98, 255, 0.10);
    }

    h1 .nova {
      display: block;

      background:
        linear-gradient(
          180deg,
          #ffe3fb 0%,
          #ebb2ff 38%,
          #d791ff 70%,
          #bf76ff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subline {
      margin: 28px auto 0;

      max-width: 520px;

      font-size: clamp(18px, 2vw, 24px);

      line-height: 1.45;

      color: rgba(255,255,255,0.88);

      text-shadow:
        0 10px 30px rgba(0,0,0,0.42);
    }

    .subline .break {
      display: block;
    }

    .cta-wrap {
      margin-top: 38px;

      display: flex;
      justify-content: center;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      min-width: 300px;

      padding: 18px 34px;

      border-radius: 999px;

      border: 1px solid var(--line);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.16),
          rgba(255,255,255,0.05)
        );

      color: white;

      text-decoration: none;

      font-size: 20px;
      font-weight: 600;

      letter-spacing: 0.01em;

      backdrop-filter: blur(14px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.14),
        0 20px 60px rgba(0,0,0,0.42),
        0 0 60px rgba(214,98,255,0.16);

      transition:
        transform 0.28s ease,
        box-shadow 0.28s ease,
        background 0.28s ease;
    }

    .cta:hover {
      transform: translateY(-2px) scale(1.03);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.22),
          rgba(255,255,255,0.08)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 24px 70px rgba(0,0,0,0.52),
        0 0 80px rgba(214,98,255,0.26);
    }

    .cta svg {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
    }

    .micro {
      margin-top: 18px;

      font-size: 12px;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.52);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes videoMove {
      from {
        transform: scale(1.05);
      }

      to {
        transform: scale(1.09);
      }
    }

    @keyframes particlesMove {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-30px);
      }
    }

    @keyframes particlesMoveReverse {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(24px);
      }
    }

    @media (max-width: 680px) {
      h1 {
        font-size: clamp(58px, 22vw, 110px);
      }

      .subline {
        max-width: 320px;

        font-size: 18px;

        line-height: 1.5;
      }

      .cta {
        min-width: 250px;

        padding: 16px 24px;

        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <video
    class="bg-video"
    autoplay
    muted
    loop
    playsinline
    poster="Nova-final-01.jpg"
  >
    <source src="Story-3er.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <div class="particles"></div>

  <main class="content">

    <div class="eyebrow">
      Nova
    </div>

    <h1>
      enter
      <span class="nova">nova</span>
    </h1>

    <p class="subline">
      A story about the moment
      <span class="break">
        you remember who you are.
      </span>
    </p>

    <div class="cta-wrap">
      <a
        class="cta"
        href="https://www.instagram.com/you.are.nova/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Enter Nova on Instagram"
      >

        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2" stroke="currentColor" stroke-width="2"></rect>
          <circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="2"></circle>
          <circle cx="17.6" cy="6.4" r="1.2" fill="currentColor"></circle>
        </svg>

        <span>Enter Nova</span>

      </a>
    </div>

    <div class="micro">
      Only a few will understand.
    </div>

  </main>

</body>
</html>
